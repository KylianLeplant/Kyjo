services:
  postgres:
    image: postgres:16-alpine
    container_name: kyjo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kyjo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kyjo}
      POSTGRES_DB: ${POSTGRES_DB:-kyjo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kyjo} -d ${POSTGRES_DB:-kyjo}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
